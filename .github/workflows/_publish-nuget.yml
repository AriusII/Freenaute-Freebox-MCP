name: Publish one NuGet package

on:
  workflow_call:
    inputs:
      rid:
        description: RID variant, or base for the portable package
        required: true
        type: string
      version:
        description: Package version
        required: true
        type: string
    secrets:
      NUGET_USER:
        required: true

permissions:
  contents: read
  id-token: write

env:
  MCP_PROJECT: mcp/Freenaute.Freebox.Mcp/Freenaute.Freebox.Mcp.csproj
  CONFIGURATION: Release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Publish ${{ inputs.rid }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup solution .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Ensure NuGet user is configured
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: test -n "$NUGET_USER"

      - name: Pack package
        shell: bash
        run: |
          output=".artifacts/nuget/${{ inputs.version }}"
          if [ "${{ inputs.rid }}" = "base" ]; then
            dotnet pack "${{ env.MCP_PROJECT }}" \
              -c "${{ env.CONFIGURATION }}" \
              -p:Version=${{ inputs.version }} \
              -p:PublishAot=false \
              -p:SelfContained=false \
              -o "$output"
            package="$output/Freenaute.Freebox.Mcp.${{ inputs.version }}.nupkg"
          else
            dotnet pack "${{ env.MCP_PROJECT }}" \
              -c "${{ env.CONFIGURATION }}" \
              -r "${{ inputs.rid }}" \
              -p:Version=${{ inputs.version }} \
              -p:PublishAot=false \
              -p:SelfContained=false \
              -o "$output"
            package="$output/Freenaute.Freebox.Mcp.${{ inputs.rid }}.${{ inputs.version }}.nupkg"
          fi
          test -f "$package"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        shell: bash
        run: |
          dotnet nuget push "$PACKAGE" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "${{ env.NUGET_SOURCE }}" \
            --skip-duplicate
