name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (for manual runs only)"
        required: false
        type: string
      publish_windows_x64_container:
        description: "Publish windows/amd64 container (requires Windows runner with Docker daemon available)"
        required: false
        default: false
        type: boolean
      publish_windows_arm_container:
        description: "Publish windows/arm64 container (requires ARM runner with Docker available)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: Freenaute.Freebox.MCP.slnx
  MCP_PROJECT: mcp/Freenaute.Freebox.Mcp/Freenaute.Freebox.Mcp.csproj
  CONFIGURATION: Release
  GHCR_IMAGE: ghcr.io/ariusii/freenaute-freebox-mcp
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      sdk: ${{ steps.sdk.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve .NET SDK from global.json
        id: sdk
        shell: pwsh
        run: |
          $sdkVersion = (Get-Content global.json | ConvertFrom-Json).sdk.version
          "value=$sdkVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $v = '${{ github.event.inputs.version }}'
          } elseif ($env:GITHUB_REF_NAME -like 'v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $proj = [xml](Get-Content $env:MCP_PROJECT)
            $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }

          if ([string]::IsNullOrWhiteSpace($v)) {
            throw 'Unable to resolve release version.'
          }

          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  validate:
    name: Validate (restore, build, test, metadata)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.resolve.outputs.sdk }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-build

      - name: Validate metadata and container policies
        run: dotnet msbuild -t:ValidateMetadata,ValidateContainers -p:Configuration=${{ env.CONFIGURATION }}

  publish-binaries:
    name: Publish ${{ matrix.rid }}
    needs:
      - resolve
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
          - rid: win-arm64
            os: windows-11-arm
            archive_ext: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.resolve.outputs.sdk }}

      - name: Install Native AOT toolchain (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore (RID-specific)
        run: dotnet restore ${{ env.MCP_PROJECT }} -r ${{ matrix.rid }}

      - name: Publish (Native AOT, single file)
        shell: pwsh
        run: dotnet publish ${{ env.MCP_PROJECT }} -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true --no-restore -p:PublishAot=true -p:PublishSingleFile=true -p:InvariantGlobalization=true -p:Version=${{ needs.resolve.outputs.version }} -o .artifacts/publish/${{ needs.resolve.outputs.version }}/${{ matrix.rid }}

      - name: Archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p .artifacts/release
          tar -czf ".artifacts/release/freenaute-freebox-mcp-${{ needs.resolve.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            -C ".artifacts/publish/${{ needs.resolve.outputs.version }}/${{ matrix.rid }}" .

      - name: Archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts/release | Out-Null
          Compress-Archive -Path ".artifacts/publish/${{ needs.resolve.outputs.version }}/${{ matrix.rid }}/*" `
            -DestinationPath ".artifacts/release/freenaute-freebox-mcp-${{ needs.resolve.outputs.version }}-${{ matrix.rid }}.zip" -Force

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-asset-${{ matrix.rid }}
          path: .artifacts/release/
          retention-days: 30

  containers-linux:
    name: Publish Linux containers (amd64 + arm64 + manifest)
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f containers/linux/x64/Dockerfile \
            --build-arg VERSION=${{ needs.resolve.outputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-linux-amd64 \
            -t ${{ env.GHCR_IMAGE }}:linux-amd64 \
            --push .

      - name: Build and push linux/arm64
        shell: bash
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f containers/linux/arm/Dockerfile \
            --build-arg VERSION=${{ needs.resolve.outputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-linux-arm64 \
            -t ${{ env.GHCR_IMAGE }}:linux-arm64 \
            --push .

      - name: Create and push Linux multi-arch manifests
        shell: bash
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:latest \
            ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-linux-amd64 \
            ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-linux-arm64

  containers-windows-x64:
    name: Publish Windows container (amd64)
    needs:
      - resolve
      - validate
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_windows_x64_container }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker availability
        id: docker_check
        shell: pwsh
        run: |
          $docker = Get-Command docker -ErrorAction SilentlyContinue
          if (-not $docker) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          docker version *> $null
          if ($LASTEXITCODE -eq 0) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Login to GHCR
        if: steps.docker_check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push windows/amd64
        if: steps.docker_check.outputs.available == 'true'
        shell: pwsh
        run: |
          docker build -f containers/windows/x64/Dockerfile --build-arg VERSION=${{ needs.resolve.outputs.version }} -t ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-windows-amd64 -t ${{ env.GHCR_IMAGE }}:windows-amd64 .
          docker push ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-windows-amd64
          docker push ${{ env.GHCR_IMAGE }}:windows-amd64

      - name: Skip windows/amd64 publish (docker unavailable)
        if: steps.docker_check.outputs.available != 'true'
        shell: pwsh
        run: Write-Host "Docker daemon is unavailable on this runner; skipping windows/amd64 container publish."

  containers-windows-arm64:
    name: Publish Windows container (arm64)
    needs:
      - resolve
      - validate
    runs-on: windows-11-arm
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_windows_arm_container }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker availability
        id: docker_check
        shell: pwsh
        run: |
          $docker = Get-Command docker -ErrorAction SilentlyContinue
          if (-not $docker) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          docker version *> $null
          if ($LASTEXITCODE -eq 0) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Login to GHCR
        if: steps.docker_check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push windows/arm64
        if: steps.docker_check.outputs.available == 'true'
        shell: pwsh
        run: |
          docker build -f containers/windows/arm/Dockerfile --build-arg VERSION=${{ needs.resolve.outputs.version }} -t ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-windows-arm64 -t ${{ env.GHCR_IMAGE }}:windows-arm64 .
          docker push ${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-windows-arm64
          docker push ${{ env.GHCR_IMAGE }}:windows-arm64

      - name: Skip windows/arm64 publish (docker unavailable)
        if: steps.docker_check.outputs.available != 'true'
        shell: pwsh
        run: Write-Host "Docker daemon is unavailable on this runner; skipping windows/arm64 container publish."

  publish-nuget:
    name: Publish NuGet package
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ needs.resolve.outputs.sdk }}

      - name: Ensure NuGet API key is configured
        if: ${{ secrets.NUGET_API_KEY == '' }}
        shell: bash
        run: echo "NUGET_API_KEY is not configured, skipping NuGet.org push for this run."

      - name: Pack NuGet MCP tool
        run: dotnet pack ${{ env.MCP_PROJECT }} -c ${{ env.CONFIGURATION }} -p:Version=${{ needs.resolve.outputs.version }} -p:PublishAot=false -p:SelfContained=false -o .artifacts/nuget/${{ needs.resolve.outputs.version }}

      - name: Push package to NuGet.org
        if: ${{ secrets.NUGET_API_KEY != '' }}
        shell: bash
        run: |
          dotnet nuget push ".artifacts/nuget/${{ needs.resolve.outputs.version }}/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "${{ env.NUGET_SOURCE }}" \
            --skip-duplicate

  release:
    name: Assemble and publish GitHub release
    needs:
      - resolve
      - validate
      - publish-binaries
      - containers-linux
      - publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download binary archives
        uses: actions/download-artifact@v6
        with:
          pattern: release-asset-*
          path: dist/binaries
          merge-multiple: true

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          artifact-name: sbom
          upload-artifact: false

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/binaries/*
            dist/sbom.spdx.json
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
