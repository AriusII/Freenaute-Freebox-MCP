name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version override
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLUTION: Freenaute.Freebox.MCP.slnx
  MCP_PROJECT: mcp/Freenaute.Freebox.Mcp/Freenaute.Freebox.Mcp.csproj
  CONFIGURATION: Release
  GHCR_IMAGE: ghcr.io/ariusii/freenaute-freebox-mcp
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  resolve:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            throw 'The release version input is required.'
          }
          $v = $env:MANUAL_VERSION.Trim()
          if ($v -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic release version: '$v'"
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  validate:
    name: Build, test, validate
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup solution .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-build

      - name: Validate metadata and container policies
        run: dotnet msbuild -t:ValidateMetadata,ValidateContainers -p:Configuration=${{ env.CONFIGURATION }}

  publish-binaries:
    name: Publish ${{ matrix.rid }}
    needs:
      - resolve
      - validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
          - rid: win-arm64
            os: windows-11-arm
            archive_ext: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup solution .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Install Native AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT binary
        shell: bash
        run: |
          dotnet publish "${{ env.MCP_PROJECT }}" \
            -c "${{ env.CONFIGURATION }}" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=true \
            -p:InvariantGlobalization=true \
            -p:Version=${{ needs.resolve.outputs.version }} \
            -o ".artifacts/publish/${{ needs.resolve.outputs.version }}/${{ matrix.rid }}"

      - name: Archive tar.gz
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p .artifacts/release
          tar -czf ".artifacts/release/freenaute-freebox-mcp-${{ needs.resolve.outputs.version }}-${{ matrix.rid }}.tar.gz" \
            -C ".artifacts/publish/${{ needs.resolve.outputs.version }}/${{ matrix.rid }}" .

      - name: Archive zip
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts/release | Out-Null
          Compress-Archive `
            -Path ".artifacts/publish/${{ needs.resolve.outputs.version }}/${{ matrix.rid }}/*" `
            -DestinationPath ".artifacts/release/freenaute-freebox-mcp-${{ needs.resolve.outputs.version }}-${{ matrix.rid }}.zip" `
            -Force

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-asset-${{ matrix.rid }}
          path: .artifacts/release/
          retention-days: 30

  containers-linux:
    name: Publish Linux ${{ matrix.platform }}
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            docker_platform: linux/amd64
            dockerfile: containers/linux/x64/Dockerfile
            tag: linux-amd64
          - platform: arm64
            docker_platform: linux/arm64
            dockerfile: containers/linux/arm/Dockerfile
            tag: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        shell: bash
        run: |
          docker buildx build \
            --platform "${{ matrix.docker_platform }}" \
            -f "${{ matrix.dockerfile }}" \
            --build-arg VERSION=${{ needs.resolve.outputs.version }} \
            -t "${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-${{ matrix.tag }}" \
            -t "${{ env.GHCR_IMAGE }}:${{ matrix.tag }}" \
            --push .

  containers-linux-manifest:
    name: Publish Linux multi-architecture manifest
    needs:
      - resolve
      - containers-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t "${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}" \
            -t "${{ env.GHCR_IMAGE }}:latest" \
            "${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-linux-amd64" \
            "${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-linux-arm64"

  containers-windows:
    name: Publish Windows ${{ matrix.platform }}
    needs:
      - resolve
      - validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            os: windows-latest
            dockerfile: containers/windows/x64/Dockerfile
            tag: windows-amd64
          - platform: arm64
            os: windows-11-arm
            dockerfile: containers/windows/arm/Dockerfile
            tag: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Docker availability
        id: docker_check
        continue-on-error: true
        shell: pwsh
        run: |
          $available = 'false'
          $PSNativeCommandUseErrorActionPreference = $false
          $docker = Get-Command docker -ErrorAction SilentlyContinue

          if ($docker) {
            try {
              & $docker.Source version 1>$null 2>$null
              if ($LASTEXITCODE -eq 0) {
                $available = 'true'
              }
            } catch {
              $available = 'false'
            }
          }

          "available=$available" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Login to GHCR
        if: steps.docker_check.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.docker_check.outputs.available == 'true'
        shell: pwsh
        run: |
          docker build `
            -f "${{ matrix.dockerfile }}" `
            --build-arg VERSION=${{ needs.resolve.outputs.version }} `
            -t "${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-${{ matrix.tag }}" `
            -t "${{ env.GHCR_IMAGE }}:${{ matrix.tag }}" `
            .
          docker push "${{ env.GHCR_IMAGE }}:${{ needs.resolve.outputs.version }}-${{ matrix.tag }}"
          docker push "${{ env.GHCR_IMAGE }}:${{ matrix.tag }}"

      - name: Skip container publish (docker unavailable)
        if: steps.docker_check.outputs.available != 'true'
        shell: pwsh
        run: Write-Host "Docker daemon is unavailable on this runner; skipping ${{ matrix.platform }} container publish."

  publish-nuget:
    name: Publish NuGet (${{ matrix.rid }})
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        rid:
          - base
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup solution .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Ensure NuGet user is configured
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: test -n "$NUGET_USER"

      - name: Pack package
        shell: bash
        run: |
          output=".artifacts/nuget/${{ needs.resolve.outputs.version }}"
          if [ "${{ matrix.rid }}" = "base" ]; then
            dotnet pack "${{ env.MCP_PROJECT }}" \
              -c "${{ env.CONFIGURATION }}" \
              -p:Version=${{ needs.resolve.outputs.version }} \
              -p:PublishAot=false \
              -p:SelfContained=false \
              -o "$output"
            package="$output/Freenaute.Freebox.Mcp.${{ needs.resolve.outputs.version }}.nupkg"
          else
            dotnet pack "${{ env.MCP_PROJECT }}" \
              -c "${{ env.CONFIGURATION }}" \
              -r "${{ matrix.rid }}" \
              -p:Version=${{ needs.resolve.outputs.version }} \
              -p:PublishAot=false \
              -p:SelfContained=false \
              -o "$output"
            package="$output/Freenaute.Freebox.Mcp.${{ matrix.rid }}.${{ needs.resolve.outputs.version }}.nupkg"
          fi
          test -f "$package"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        shell: bash
        run: |
          dotnet nuget push "$PACKAGE" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "${{ env.NUGET_SOURCE }}" \
            --skip-duplicate

  release:
    name: Assemble and publish GitHub release
    needs:
      - resolve
      - publish-binaries
      - containers-linux-manifest
      - publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download binary archives
        uses: actions/download-artifact@v6
        with:
          pattern: release-asset-*
          path: dist/binaries
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          artifact-name: sbom
          upload-artifact: false

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          name: Release v${{ needs.resolve.outputs.version }}
          files: |
            dist/binaries/*
            dist/sbom.spdx.json
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
